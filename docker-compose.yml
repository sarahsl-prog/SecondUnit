version: "3.8"

services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=simulator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  brain:
    build:
      context: .
      dockerfile: Dockerfile.brain
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=brain
      - SECONDUNIT_HANDS_SERVICE_URL=http://hands:8080
    depends_on:
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  hands:
    build:
      context: .
      dockerfile: Dockerfile.hands
    ports:
      - "8083:8080"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=hands
    depends_on:
      brain:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
