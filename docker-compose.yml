version: "3.8"

services:
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=simulator

  brain:
    build:
      context: .
      dockerfile: Dockerfile.brain
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=brain
      - HANDS_SERVICE_URL=http://hands:8080
    depends_on:
      - simulator

  hands:
    build:
      context: .
      dockerfile: Dockerfile.hands
    ports:
      - "8083:8080"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=hands
    depends_on:
      - brain
