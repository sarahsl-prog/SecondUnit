[project]
name = "secondunit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=0.1.0",
    "google-cloud-logging>=3.16.2",
    "google-genai>=2.0.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "structlog>=26.1.0",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = [
    "shared/tests",
    "brain/tests",
    "hands/tests",
    "simulator/tests",
    "tests/integration",
]
pythonpath = ["."]
asyncio_mode = "auto"
